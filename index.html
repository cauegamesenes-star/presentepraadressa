<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0f5">
  <title>Para você </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ceu" aria-hidden="true"></div>

  <main class="cartao">
    <div class="ursinho" aria-hidden="true">⋆˚────୨ৎ────·𖹭</div>

    <!-- Lírio-do-vale: aparece e abre quando ela clica em "Sim" -->
    <div id="lirio" class="lirio" hidden aria-hidden="true">
      <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="sino" d="M0 0 C-9 0 -11 10 -13 18 C-9 22 -5 18 0 22 C5 18 9 22 13 18 C11 10 9 0 0 0Z"/>
        </defs>

        <!-- folhas -->
        <path class="folha" d="M98 252 C55 235 40 175 62 120 C90 150 104 200 98 252Z"/>
        <path class="folha dir" d="M102 252 C150 238 165 185 140 140 C112 165 98 205 102 252Z"/>

        <!-- caule em arco -->
        <path class="caule" pathLength="1" d="M100 250 C98 190 96 120 112 72 C122 42 152 28 170 52"/>

        <!-- pedúnculos -->
        <path class="ped" style="--d:1.4s" d="M104 103 Q114 104 116 118"/>
        <path class="ped" style="--d:1.6s" d="M110 80 Q100 82 98 96"/>
        <path class="ped" style="--d:1.85s" d="M123 53 Q130 58 128 70"/>
        <path class="ped" style="--d:2.05s" d="M138 42 Q150 44 151 58"/>
        <path class="ped" style="--d:2.25s" d="M170 52 Q175 56 172 66"/>

        <!-- sininhos (flores) -->
        <g transform="translate(116 118) scale(.85)"><g class="sino" style="--d:1.4s"><use href="#sino"/></g></g>
        <g transform="translate(98 96) scale(.85)"><g class="sino" style="--d:1.6s"><use href="#sino"/></g></g>
        <g transform="translate(128 70) scale(.85)"><g class="sino" style="--d:1.85s"><use href="#sino"/></g></g>
        <g transform="translate(151 58) scale(.85)"><g class="sino" style="--d:2.05s"><use href="#sino"/></g></g>
        <g transform="translate(172 66) scale(.85)"><g class="sino" style="--d:2.25s"><use href="#sino"/></g></g>
      </svg>
    </div>

    <h1 id="titulo" class="editavel">Uma cartinha pra dressa meu amor</h1>

    <!-- CAIXA DE TEXTO EDITÁVEL: clique em "Editar texto" e escreva o que quiser -->
    <div id="mensagem" class="caixa editavel">
      Você quer abrir essa carta que eu fiz com
       todo amor do mundo?(Você nao tem escolha ok meubem)
      <br><br>
      
      <strong>Prometo pra você que vale a pena</strong> 
    </div>

    <div class="botoes" id="botoes">
      <button id="sim" class="btn btn-sim">Sim </button>
      <button id="nao" class="btn btn-nao">Não</button>
    </div>

    <button id="editar" class="btn-editar" type="button">✏️ Editar texto</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
